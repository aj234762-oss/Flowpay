spring.application.name=FlowPay

# Run locally with an in-memory H2 database by default. Set DB_URL, DB_USERNAME,
# and DB_PASSWORD to use MySQL or another configured JDBC database.
spring.datasource.url=${DB_URL:jdbc:h2:mem:flowpay;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false

app.webhook-hosts=${WEBHOOK_HOST:localhost,127.0.0.1}
app.webhook.delivery-interval-ms=${WEBHOOK_DELIVERY_INTERVAL_MS:5000}
app.jobs-enabled=true
app.kafka-enabled=false


app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.reconciliation-poll-ms=${RECONCILIATION_POLL_MS:60000}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
info.app.name=FlowPay
info.app.description=Local payment gateway simulator

logging.structured.format.console=logstash
