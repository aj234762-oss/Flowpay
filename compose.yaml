services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flowpay
      POSTGRES_USER: flowpay
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flowpay-local-only}
    ports:
      - "5432:5432"
    volumes:
      - flowpay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpay -d flowpay"]
      interval: 5s
      timeout: 3s
      retries: 15

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flowpay
      DB_USERNAME: flowpay
      DB_PASSWORD: ${DB_PASSWORD:-flowpay-local-only}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8080}
      WEBHOOK_HOST: ${WEBHOOK_HOST:-localhost,127.0.0.1}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  flowpay-postgres:
