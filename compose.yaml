services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flowpay
      POSTGRES_USER: flowpay
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flowpay-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flowpay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpay -d flowpay"]
      interval: 5s
      timeout: 3s
      retries: 15

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

  backend:
    image: arjunsingh63/flowpay:razor-v2-backend
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flowpay
      DB_USERNAME: flowpay
      DB_PASSWORD: ${DB_PASSWORD:-flowpay-local-only}
      KAFKA_SERVERS: kafka:29092
      APP_PUBLIC_BASE_URL: http://localhost:8080
      WEBHOOK_HOSTS: localhost,127.0.0.1,receiver,backend,host.docker.internal
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  frontend:
    image: arjunsingh63/flowpay:razor-v2-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped

  receiver:
    image: arjunsingh63/flowpay:razor-v2-receiver
    build:
      context: ./receiver
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

volumes:
  flowpay-postgres:
